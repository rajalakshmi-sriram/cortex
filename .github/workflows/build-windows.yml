name: Build Windows desktop app

# Manual trigger: PyInstaller can't cross-compile, so the Windows backend
# binary has to be built by an actual Windows machine - this runs the same
# steps documented in DESKTOP_APP_BUILD.md on a GitHub-hosted Windows
# runner and attaches the installer to an existing GitHub Release.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing release tag to attach the installer to'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: dtolnay/rust-toolchain@stable

      - name: Build backend (PyInstaller)
        run: |
          python -m venv venv-run
          venv-run\Scripts\pip install -r requirements.txt pyinstaller
          venv-run\Scripts\pyinstaller cortex_backend.spec --noconfirm

      - name: Build frontend
        run: |
          cd web
          npm install
          npm run build

      - name: Build Tauri installer
        run: |
          cd desktop-tauri
          npm install
          npm run tauri build

      - name: Upload installer to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ inputs.release_tag }}" desktop-tauri/src-tauri/target/release/bundle/nsis/*.exe --clobber
